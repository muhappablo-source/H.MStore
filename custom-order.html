const sb=window.supabase.createClient('https://vknwuafwblmpezxbcydd.supabase.co','sb_publishable_jrTAyW1RzTKHzIBzi7bxYw_gPQcwUgO');
const el=id=>document.getElementById(id);function show(id,text){const e=el(id);e.textContent=text;e.hidden=false}
el('customOrderForm').addEventListener('submit',async e=>{e.preventDefault();const b=el('customSubmit'),file=el('customPhoto').files[0],qty=Number(el('customQty').value);if(!file||!file.type.startsWith('image/')||file.size>5242880){show('customMsg','اختار صورة صحيحة لا تتجاوز 5 ميجابايت.');return}if(!Number.isInteger(qty)||qty<1||qty>30){show('customMsg','العدد من 1 إلى 30.');return}b.disabled=true;b.textContent='جاري الإرسال...';try{const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg',path=crypto.randomUUID()+'.'+ext;const up=await sb.storage.from('custom-order-images').upload(path,file,{contentType:file.type});if(up.error)throw up.error;const image=sb.storage.from('custom-order-images').getPublicUrl(path).data.publicUrl,code=crypto.randomUUID().replace(/-/g,'').slice(0,12).toUpperCase();const result=await sb.from('custom_requests').insert({request_code:code,customer_name:el('customName').value.trim(),customer_phone:el('customPhone').value.trim(),product_type:el('customType').value,quantity:qty,details:el('customDetails').value.trim(),image_url:image,status:'pending'});if(result.error)throw result.error;show('customMsg','تم استلام طلبك للمراجعة. كود طلبك: '+code+' — احتفظ به للمتابعة.');el('trackCode').value=code;el('customOrderForm').reset();el('customQty').value='1'}catch(err){console.error(err);show('customMsg','سبب الخطأ: '+(err?.message||err?.error_description||String(err))+' — ابعتلي صورة الرسالة دي.')}finally{b.disabled=false;b.textContent='إرسال طلب للمراجعة'}});
